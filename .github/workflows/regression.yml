# Nightly full-pipeline regression: runs the rStride suite against the stored
# reference .rds files.
#
# Not a pull-request gate: the suite is ~1336 s of simulation time across 115
# runs, which is too slow to sit in front of every change.
#
# Runs only when master changed in the last 24 hours (a manual run via
# workflow_dispatch always runs).
#
# STATUS: informational. The job fails only if the build, the R setup or the
# script itself errors. It does NOT yet detect a regression: the comparison in
# rStride_gtester_covid19.R prints differences but never sets an exit code, and
# exact comparison against references produced on macOS is not portable to
# Linux (plan section 7.4, items 2-3). Read regression.log in the artefacts.

name: Nightly regression

on:
  schedule:
    - cron: '0 2 * * *'     # 02:00 UTC daily
  workflow_dispatch:

jobs:
  # Skip the ~30 min run when nothing landed on master since the previous night.
  # master only changes through merged pull requests, so the committer date of
  # its HEAD is the time of the last change.
  changes:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - id: check
        shell: bash
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          age=$(( $(date +%s) - $(git log -1 --format=%ct) ))
          echo "HEAD $(git rev-parse --short HEAD) is ${age}s old"
          if [ "$age" -lt 86400 ]; then
            echo "run=true"  >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  regression:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build ccache libomp-dev

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          # Posit Package Manager serves precompiled Linux binaries; building
          # sf and friends from source would take longer than the suite itself.
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          # Everything rStride.R loads via smd_load_packages(), so nothing is
          # installed at run time. The USA-only packages (haven .. usmap) go
          # once Phase 1 moves them to Suggests.
          # simid.rtools is pinned to a commit (the repository has no tags), so
          # a change there cannot silently alter a regression result.
          packages: |
            github::lwillem/simid_rtools@caa0d5e92652bc0bb4d15a975991ee99c2b2618d
            any::XML
            any::doParallel
            any::data.table
            any::ggplot2
            any::gridExtra
            any::mgcv
            any::openxlsx
            any::scales
            any::tidyr
            any::lhs
            any::corrplot
            any::wpp2019
            any::dplyr
            any::useful
            any::haven
            any::VGAM
            any::sf
            any::tigris
            any::usmap
          cache-version: 2

      - name: Build and install stride
        run: make install

      - name: Run the rStride regression suite
        shell: bash      # -eo pipefail: an R error fails the step despite tee
        run: |
          cd "$HOME/opt/stride"
          Rscript ./bin/rStride_gtester_covid19.R 2>&1 | tee regression.log

      - name: Upload regression output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-output
          path: |
            ~/opt/stride/regression.log
            ~/opt/stride/sim_output/**/*.pdf
            ~/opt/stride/sim_output/**/*_summary.csv
          if-no-files-found: warn
          retention-days: 14
