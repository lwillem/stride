# Per-pull-request gate: check that the C++ code configures, compiles and installs
# without errors, with gcc and with clang.
#
# The C++ scenario suite (bin/gtester, ~2 min) is deliberately not run here for now;
# to re-enable it, replace `make install` below by `make gtest` and restore an
# upload step for ~/opt/stride/tests/gtester_all.xml.
#
# Deliberately excludes the R regression suite, which takes ~22 minutes of
# simulation time and runs nightly instead (see regression.yml).
#
# STATUS: draft. See doc/markdown/rStride_refactoring_plan.md section 7.

name: CI

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: ${{ matrix.compiler }} / ${{ matrix.build_type }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
        build_type: [Release]

    steps:
      # Shallow clone: the repository carries ~110 MB of historical binary
      # weight (F14) that no build needs. fetch-depth 1 avoids all of it.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build ccache libomp-dev
          # No Boost required: util/Ptree.h is a pugixml-based replacement for
          # boost::property_tree. trng, pugixml, spdlog and tclap are vendored
          # under main/resources/lib.

      - name: Select compiler
        run: |
          if [ "${{ matrix.compiler }}" = "gcc" ]; then
            echo "CC=gcc"  >> "$GITHUB_ENV"
            echo "CXX=g++" >> "$GITHUB_ENV"
          else
            echo "CC=clang"   >> "$GITHUB_ENV"
            echo "CXX=clang++" >> "$GITHUB_ENV"
          fi
          # CMake (>= 3.17) reads these at configure time; without them ccache is
          # installed but never called, so nothing is ever cached.
          echo "CMAKE_C_COMPILER_LAUNCHER=ccache"   >> "$GITHUB_ENV"
          echo "CMAKE_CXX_COMPILER_LAUNCHER=ccache" >> "$GITHUB_ENV"

      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ matrix.compiler }}-${{ matrix.build_type }}

      # `make install` configures, builds and installs to $HOME/opt/stride (the
      # stable install root, plan F1). Any configure, compile, link or install error
      # fails the job.
      - name: Build and install
        run: make install CMAKE_BUILD_TYPE=${{ matrix.build_type }}
